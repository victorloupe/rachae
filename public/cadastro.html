<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rachaê — Criar conta</title>
  <link rel="icon" type="image/jpeg" href="assets/icon.jpg" />
  <meta name="theme-color" content="#059669" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="assets/icon.jpg" />
  <link rel="manifest" href="manifest.json" />
  <script>(function(){try{const t=localStorage.getItem("rachae_tema")||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-tema",t);}catch(e){}})();</script>
  <link rel="stylesheet" href="css/style.css?v=39" />
</head>
<body>
  <!-- Overlay de Transição Pós-Cadastro: "Entrando na casa" -->
  <div id="animacao-entrando-casa" class="splash-screen-overlay" style="display: none;" aria-hidden="true">
    <div class="splash-conteudo">
      <div class="splash-logo-wrapper">
        <div class="splash-glow"></div>
        <div class="icone-casa-pulsante">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
      </div>
      <div class="splash-texto">
        <h2 class="splash-titulo" id="anim-titulo-entrando">Entrando na <span>casa</span></h2>
        <p class="splash-subtitulo" id="anim-subtitulo-entrando">Configurando seu perfil e contas...</p>
      </div>
      <div class="splash-carregando">
        <div class="splash-barra-progresso">
          <div class="splash-barra-fill" id="anim-barra-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="tela-auth">
    <!-- Ambient Glow de Fundo -->
    <div class="auth-ambient-glow" aria-hidden="true">
      <div class="auth-glow-orb auth-glow-1"></div>
      <div class="auth-glow-orb auth-glow-2"></div>
    </div>

    <div class="auth-wrapper">
      <div class="auth-topo">
        <h1 class="visually-hidden">Rachaê — Cadastro de Morador</h1>
        <div class="auth-logo-badge">
          <div class="auth-logo-halo"></div>
          <img src="assets/LogoSite.jpg" alt="Rachaê" class="auth-logo-img" />
        </div>
        <p class="auth-subtitulo">Crie sua conta e comece a dividir as contas da casa.</p>
      </div>

      <!-- Banner se houver convite pendente na URL -->
      <div id="banner-convite-container"></div>

      <div class="card card-auth">
        <div class="card-auth-cabecalho">
          <h2>Criar conta</h2>
          <p>Leva menos de 1 minuto para configurar seu perfil.</p>
        </div>

        <form id="form-cadastro">
          <label for="nome">Seu nome</label>
          <div class="campo-wrapper">
            <span class="campo-icone-esq">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input type="text" id="nome" required placeholder="Ex: Ana Souza" autocomplete="name" />
          </div>

          <label for="telefone">Telefone / WhatsApp <span class="texto-suave" style="font-size:11px; font-weight:normal;">(opcional)</span></label>
          <div class="campo-wrapper">
            <span class="campo-icone-esq">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
              </svg>
            </span>
            <input type="tel" id="telefone" placeholder="(11) 99999-9999" autocomplete="tel" inputmode="tel" />
          </div>

          <label for="email">E-mail</label>
          <div class="campo-wrapper">
            <span class="campo-icone-esq">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input type="email" id="email" required autocomplete="email" placeholder="seu@email.com" />
          </div>

          <label for="senha">Senha</label>
          <div class="campo-wrapper">
            <span class="campo-icone-esq">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="senha" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres" />
            <button type="button" class="btn-toggle-senha" onclick="alternarVisibilidadeSenha('senha', this)" title="Mostrar senha" aria-label="Mostrar senha">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <button type="submit" id="btn-submit-cadastro" class="btn-auth-submit">
            <span>Criar minha conta</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
          <p id="msg-cadastro"></p>
        </form>
      </div>

      <div class="auth-rodape">
        <p>
          Já tem conta?
          <a class="link-destaque" id="link-login-rodape" href="index.html">Entrar</a>
        </p>
        <div class="auth-selo-seguranca">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>Ambiente seguro · Dados protegidos</span>
        </div>
      </div>
    </div>
  </div>

  <!-- GSAP & Animações -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="js/animacoes.js?v=39"></script>

  <!-- Supabase JS CDN (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=39"></script>
  <script src="js/mockClient.js?v=39"></script>
  <script src="js/supabaseClient.js?v=39"></script>
  <script src="js/auth.js?v=39"></script>
</body>
</html>
